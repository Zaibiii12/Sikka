services:

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: blocksikka-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    volumes:
      - ./prometheus/prometheus.portfolio.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    networks:
      - monitoring_net
      - sikka_net
      - postgres_net

    restart: unless-stopped


  grafana:
    image: grafana/grafana:12.1.1
    container_name: blocksikka-grafana

    environment:
      GF_SECURITY_ADMIN_USER:
        ${GRAFANA_ADMIN_USER}

      GF_SECURITY_ADMIN_PASSWORD:
        ${GRAFANA_ADMIN_PASSWORD}

      GF_USERS_ALLOW_SIGN_UP:
        "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - monitoring_net

    depends_on:
      - prometheus

    restart: unless-stopped


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: blocksikka-postgres-exporter

    env_file:
      - .postgres-exporter.env

    networks:
      - postgres_net

    restart: unless-stopped


networks:

  monitoring_net:
    driver: bridge

  sikka_net:
    external: true
    name: blocksikka-sikka-net

  postgres_net:
    external: true
    name: ${POSTGRES_NETWORK}


volumes:

  prometheus_data:

  grafana_data:
