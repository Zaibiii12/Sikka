title = "BlockSikka Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Known public Anvil development key used only by Deploy.s.sol"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^contracts/script/Deploy\.s\.sol$'''
]
regexes = [
  '''DEFAULT_DEV_KEY\s*=\s*0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'''
]
