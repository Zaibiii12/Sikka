name: BlockSikka System CI

on:
  push:
    branches:
      - main
    paths:
      - "network/**"
      - "backend/app/core/web3_client.py"
      - "backend/tests/test_qbft_web3.py"
      - ".github/workflows/system-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "network/**"
      - "backend/app/core/web3_client.py"
      - "backend/tests/test_qbft_web3.py"
      - ".github/workflows/system-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocksikka-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  qbft-network:
    name: QBFT Network Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RPC_URL: http://127.0.0.1:8545
      CHAIN_ID: "1337"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt


      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt


      - name: Show environment
        run: |
          docker --version
          docker compose version
          forge --version
          cast --version
          python --version


      - name: Prepare network directories
        working-directory: network
        run: |
          mkdir -p \
            data/validator1 \
            data/validator2 \
            data/validator3 \
            data/validator4 \
            keys/validator1 \
            keys/validator2 \
            keys/validator3 \
            keys/validator4 \
            genesis

          chmod +x scripts/generate-keys.sh


      - name: Generate ephemeral QBFT network
        working-directory: network
        run: |
          ./scripts/generate-keys.sh

          echo
          echo "=== VALIDATOR ADDRESSES ==="
          cat keys/address-map.txt

          echo
          echo "=== GENERATED GENESIS ==="
          test -s genesis/genesis.json

          echo
          echo "=== GENERATED NETWORK ENV ==="
          test -s .env


      - name: Validate network Compose
        working-directory: network
        run: |
          docker compose config >/dev/null

          echo "Network Compose configuration: PASS"


      - name: Start four-validator network
        working-directory: network
        run: |
          docker compose up -d

          docker compose ps


      - name: Wait for validators
        working-directory: network
        shell: bash
        run: |
          set -euo pipefail

          validators=(
            sikka-validator1
            sikka-validator2
            sikka-validator3
            sikka-validator4
          )

          echo "Waiting for all validators..."

          for attempt in $(seq 1 60); do

            healthy=0

            echo
            echo "Attempt ${attempt}/60"

            for validator in "${validators[@]}"; do

              status="$(
                docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$validator" \
                  2>/dev/null \
                  || echo missing
              )"

              echo "$validator: $status"

              if [ "$status" = "healthy" ]; then
                healthy=$((healthy + 1))
              fi

            done

            if [ "$healthy" -eq 4 ]; then
              echo
              echo "All four validators healthy."
              exit 0
            fi

            sleep 5

          done

          echo
          echo "ERROR: validators did not become healthy."

          docker compose ps
          docker compose logs --tail=200

          exit 1


      - name: Verify chain ID
        run: |
          actual="$(
            cast chain-id \
              --rpc-url "$RPC_URL"
          )"

          echo "Expected chain ID: $CHAIN_ID"
          echo "Actual chain ID:   $actual"

          test "$actual" = "$CHAIN_ID"


      - name: Verify block production
        shell: bash
        run: |
          set -euo pipefail

          first="$(
            cast block-number \
              --rpc-url "$RPC_URL"
          )"

          echo "First block: $first"

          sleep 8

          second="$(
            cast block-number \
              --rpc-url "$RPC_URL"
          )"

          echo "Second block: $second"

          if [ "$second" -le "$first" ]; then
            echo "ERROR: QBFT block production did not advance."
            exit 1
          fi

          echo "QBFT block production: PASS"


      - name: Verify QBFT validator set
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl -sf \
              -X POST \
              -H "Content-Type: application/json" \
              --data '{
                "jsonrpc": "2.0",
                "method": "qbft_getValidatorsByBlockNumber",
                "params": ["latest"],
                "id": 1
              }' \
              "$RPC_URL"
          )"

          echo "$response" | jq

          count="$(
            echo "$response" \
              | jq '.result | length'
          )"

          echo "Validator count: $count"

          if [ "$count" -ne 4 ]; then
            echo "ERROR: expected 4 QBFT validators."
            exit 1
          fi

          echo "QBFT validator set: PASS"


      - name: Verify peer connectivity
        shell: bash
        run: |
          set -euo pipefail

          peer_hex="$(
            cast rpc \
              net_peerCount \
              --rpc-url http://127.0.0.1:8547 \
            | tr -d '"'
          )"

          peer_count=$((peer_hex))

          echo "Validator2 peers: $peer_count"

          if [ "$peer_count" -ne 3 ]; then
            echo "ERROR: expected validator2 to have 3 peers."
            exit 1
          fi

          echo "Peer connectivity: PASS"


      - name: Run live QBFT backend test
        working-directory: backend
        env:
          RPC_URL: http://127.0.0.1:8545
          CHAIN_ID: "1337"
        run: |
          pytest -q \
            tests/test_qbft_web3.py


      - name: Capture network logs
        if: always()
        working-directory: network
        run: |
          docker compose ps > system-ci-status.txt 2>&1 || true

          docker compose logs \
            --no-color \
            > system-ci-network.log \
            2>&1 || true


      - name: Upload network diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocksikka-qbft-system-ci
          path: |
            network/system-ci-status.txt
            network/system-ci-network.log
          if-no-files-found: ignore
          retention-days: 7


      - name: Stop network
        if: always()
        working-directory: network
        run: |
          docker compose down \
            --volumes \
            --remove-orphans \
            || true
